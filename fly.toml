# fly.toml app configuration file generated for tentrackule on 2026-01-15T18:06:22+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tentrackule'
primary_region = 'cdg'

[build]

[env]
  DATABASE_URL = 'sqlite:/data/tentrackule.db'
  # DDRAGON_VERSION is intentionally unset: the patch is auto-resolved from
  # ddragon versions.json at boot and refreshed every 24h. Set it only to pin a
  # specific patch in an emergency (a fresh patch breaking assets).
  LOG_FORMAT = 'json'
  POLLING_INTERVAL_SECS = '60'
  RUST_LOG = 'info,tentrackule=debug'
  # Cards are rendered by Cloudflare Browser Run. Both values are secrets:
  #   fly secrets set CLOUDFLARE_ACCOUNT_ID=<id> CLOUDFLARE_API_TOKEN=<token>
  # See docs/renderer-deploy.md.

[[mounts]]
  source = 'tentrackule_data'
  destination = '/data'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
