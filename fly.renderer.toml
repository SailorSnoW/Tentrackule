# Renderer app — headless-Chromium HTML→PNG service (Browserless).
# Deployed separately from the bot so the bot VM stays lean at 256 MB.
# Full walkthrough: docs/renderer-deploy.md
#
#   fly apps create tentrackule-renderer
#   fly secrets set -a tentrackule-renderer TOKEN=<random-token>
#   fly deploy -c fly.renderer.toml --flycast
#
# Reached privately at http://tentrackule-renderer.flycast:3000. We go through
# the Fly proxy (`.flycast`) on purpose: it is what autostarts the scaled-to-zero
# machine on the first request. A plain `.internal` address connects directly to
# the instance, bypasses the proxy, and would never wake a stopped machine.

app = 'tentrackule-renderer'
primary_region = 'cdg'

[build]
  image = 'ghcr.io/browserless/chromium:latest'

[env]
  # Max concurrent Chromium sessions — keep low relative to VM memory to avoid OOM.
  CONCURRENT = '2'
  # Per-session hard cap (ms) so a stuck render can't pin the machine awake.
  TIMEOUT = '60000'
  # TOKEN is provided as a secret (`fly secrets set TOKEN=…`), never in this file.

[[services]]
  internal_port = 3000
  protocol = 'tcp'
  # Keep one machine ALWAYS warm (min_machines_running = 1) — do NOT scale to zero.
  # Chromium's first launch on a freshly-woken machine (cold boot *or* resume from
  # suspend) routinely overruns Browserless's fixed 30 s launch timeout: the WS
  # endpoint never appears, the render fails and the bot falls back to a text embed.
  # That launch timeout is not configurable and the OSS image has no PREBOOT_CHROME,
  # so the only robust fix is to never let the machine go cold — a warm machine
  # launches Chrome in 1-6 s. Paired with `fly scale count 1`: a single machine that
  # never stops. (auto_stop 'stop' only bites any scaled-up extras, of which none.)
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 3000
    handlers = ['http']

  [services.concurrency]
    type = 'requests'
    soft_limit = 2
    hard_limit = 4

# Dedicated CPU: Chromium's cold launch is CPU-bursty and timed out (>30 s to
# print its WS endpoint) on a shared vCPU, so every render fell back to a text
# embed. A performance core boots it in a few seconds; 2 GB leaves headroom for
# the render + CONCURRENT=2. This VM stays always-on (see min_machines_running).
[[vm]]
  memory = '2048mb'
  cpu_kind = 'performance'
  cpus = 1
