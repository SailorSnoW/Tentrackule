# Renderer app — headless-Chromium HTML→PNG service (Browserless).
# Deployed separately from the bot so the bot VM stays lean at 256 MB.
# Full walkthrough: docs/renderer-deploy.md
#
#   fly apps create tentrackule-renderer
#   fly secrets set -a tentrackule-renderer TOKEN=<random-token>
#   fly deploy -c fly.renderer.toml --flycast
#
# Reached privately at http://tentrackule-renderer.flycast:3000. We go through
# the Fly proxy (`.flycast`) on purpose: it is what autostarts the scaled-to-zero
# machine on the first request. A plain `.internal` address connects directly to
# the instance, bypasses the proxy, and would never wake a stopped machine.

app = 'tentrackule-renderer'
primary_region = 'cdg'

[build]
  image = 'ghcr.io/browserless/chromium:latest'

[env]
  # Max concurrent Chromium sessions — keep low relative to VM memory to avoid OOM.
  CONCURRENT = '2'
  # Per-session hard cap (ms) so a stuck render can't pin the machine awake.
  TIMEOUT = '60000'
  # TOKEN is provided as a secret (`fly secrets set TOKEN=…`), never in this file.

[[services]]
  internal_port = 3000
  protocol = 'tcp'
  # Scale to zero when idle (min_machines_running = 0): the renderer does only a
  # few cards a day, so an always-warm machine is ~90% of the infra bill for
  # almost no work. The Fly proxy (.flycast) autostarts the stopped machine on the
  # first request. That first request MAY fail — Chromium's cold launch can overrun
  # Browserless's fixed 30 s launch timeout (not configurable; the OSS image has no
  # PREBOOT_CHROME) — so the bot's render path retries once ~25 s later, by which
  # point Chrome is warm (1-6 s). See `render_with_retry` (Phase 3.A); a render that
  # still fails degrades to a text embed. If cold starts prove too flaky, revert to
  # `min_machines_running = 1` + `fly scale count 1`, or move to Fly Machines API
  # orchestration (Phase 3.B fallback).
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 3000
    handlers = ['http']

  [services.concurrency]
    type = 'requests'
    soft_limit = 2
    hard_limit = 4

# Dedicated CPU: Chromium's cold launch is CPU-bursty and timed out (>30 s to
# print its WS endpoint) on a shared vCPU, so every render fell back to a text
# embed. A performance core boots it in a few seconds; 2 GB leaves headroom for
# the render + CONCURRENT=2. Kept even under scale-to-zero: we now pay for it only
# the few minutes a day the machine is awake, and a fast cold launch is exactly
# what keeps the render retry (Phase 3.A) landing inside its budget.
[[vm]]
  memory = '2048mb'
  cpu_kind = 'performance'
  cpus = 1
